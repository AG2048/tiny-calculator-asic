<svg xmlns="http://www.w3.org/2000/svg" width="2900" height="1540" viewBox="0 0 2900 1540" role="img" aria-labelledby="title desc">
  <title id="title">Tiny Calculator detailed design architecture and wire-level pin connections</title>
  <desc id="desc">Detailed architecture showing each keypad, button, mode, operation indicator, and shift-register wire separately, with grouped buses only for valid-ready transactions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="2.4" markerHeight="2.4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2563eb"/></marker>
    <style>
      .title{font:700 38px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 19px Arial,sans-serif;fill:#475569}
      .heading{font:700 24px Arial,sans-serif;fill:#0f172a}.small-heading{font:700 20px Arial,sans-serif;fill:#0f172a}
      .body{font:400 17px Arial,sans-serif;fill:#334155}.small{font:400 15px Arial,sans-serif;fill:#475569}
      .wire-label{font:600 15px Arial,sans-serif;fill:#334155}.bus-label{font:600 16px Arial,sans-serif;fill:#1d4ed8}
      .box{stroke:#334155;stroke-width:2.5;rx:18}.boundary{fill:none;stroke:#94a3b8;stroke-width:3;stroke-dasharray:10 8;rx:24}.divider{stroke:#64748b;stroke-width:2;stroke-dasharray:8 7}
      .wire{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}.wire-left{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
      .bus{fill:none;stroke:#2563eb;stroke-width:8;marker-start:url(#arrow-blue);marker-end:url(#arrow-blue)}
    </style>
  </defs>
  <rect width="2900" height="1540" fill="#f8fafc"/>
  <text x="60" y="62" class="title">Tiny Calculator: detailed architecture and physical wires</text>
  <text x="60" y="98" class="subtitle">Every external signal is drawn separately. Thick blue links are the only grouped valid/ready transaction buses.</text>

  <g>
    <rect class="box" x="70" y="205" width="370" height="455" fill="#fef3c7"/>
    <text x="255" y="243" class="heading" text-anchor="middle">4x4 Hexadecimal Keypad</text>
    <text x="94" y="281" class="body" text-anchor="start">Each pressed key shorts one active</text>
<text x="94" y="309" class="body" text-anchor="start">word line to one bit line.</text>
<text x="94" y="337" class="body" text-anchor="start"></text>
<text x="94" y="365" class="body" text-anchor="start">WL0 → digits 0 1 2 3</text>
<text x="94" y="393" class="body" text-anchor="start">WL1 → digits 4 5 6 7</text>
<text x="94" y="421" class="body" text-anchor="start">WL2 → digits 8 9 A B</text>
<text x="94" y="449" class="body" text-anchor="start">WL3 → digits C D E F</text>
  </g>
  <g>
    <rect class="box" x="70" y="690" width="370" height="390" fill="#ffedd5"/>
    <text x="255" y="728" class="heading" text-anchor="middle">Control Hardware</text>
    <text x="94" y="766" class="body" text-anchor="start">Seven active-high buttons:</text>
<text x="94" y="794" class="body" text-anchor="start">+  −  ×  ÷  =  AC  NEG</text>
<text x="94" y="822" class="body" text-anchor="start"></text>
<text x="94" y="850" class="body" text-anchor="start">One mode switch:</text>
<text x="94" y="878" class="body" text-anchor="start">NEG_EN</text>
<text x="94" y="906" class="body" text-anchor="start"></text>
<text x="94" y="934" class="body" text-anchor="start">Use a pull-down resistor</text>
<text x="94" y="962" class="body" text-anchor="start">on every active-high input.</text>
  </g>

  <rect class="boundary" x="730" y="155" width="1550" height="1230"/>
  <text x="760" y="190" class="small-heading">tt_um_ag2048_tiny_calculator</text>

  <g>
    <rect class="box" x="790" y="215" width="340" height="815" fill="#dbeafe"/>
    <text x="960" y="255" class="heading" text-anchor="middle">button_reader</text>
    <text x="960" y="292" class="small-heading" text-anchor="middle">matrix-keypad section</text>
    <text x="820" y="332" class="body">4-cycle WL scanner</text>
    <text x="820" y="362" class="body">BL priority decoder</text>
    <text x="820" y="392" class="body">Rightmost pressed BL wins</text>
    <text x="820" y="432" class="small">WL[3:0] → keypad</text>
    <text x="820" y="460" class="small">BL[3:0] ← keypad</text>
    <line x1="815" y1="640" x2="1105" y2="640" class="divider"/>
    <text x="960" y="680" class="small-heading" text-anchor="middle">control-button section</text>
    <text x="820" y="718" class="body">Seven independent input wires</text>
    <text x="820" y="748" class="small">ADD, SUB, MUL, DIV</text>
    <text x="820" y="776" class="small">EQ, AC, NEG</text>
    <text x="820" y="818" class="body">Operation buttons override keypad</text>
    <text x="820" y="848" class="body">Fixed priority: + − × ÷ = AC NEG</text>
    <text x="820" y="900" class="small-heading">shared event output</text>
    <text x="820" y="932" class="small">Wait for full release, then emit:</text>
    <text x="820" y="960" class="small">0xxxx = hex digit</text>
    <text x="820" y="988" class="small">10xxx = operation/control</text>
  </g>
  <g>
    <rect class="box" x="1290" y="345" width="400" height="520" fill="#dcfce7"/>
    <text x="1490" y="383" class="heading" text-anchor="middle">calculator_core</text>
    <text x="1314" y="421" class="body" text-anchor="start">25-state user-interface FSM</text>
<text x="1314" y="449" class="body" text-anchor="start">A[15:0], B[15:0] registers</text>
<text x="1314" y="477" class="body" text-anchor="start">current_op[1:0] register</text>
<text x="1314" y="505" class="body" text-anchor="start">Signed entry and display logic</text>
<text x="1314" y="533" class="body" text-anchor="start">Chaining and repeated =</text>
<text x="1314" y="561" class="body" text-anchor="start">Division-error lock</text>
<text x="1314" y="589" class="body" text-anchor="start"></text>
<text x="1314" y="617" class="body" text-anchor="start">Own full_adder instance:</text>
<text x="1314" y="645" class="body" text-anchor="start">nibble append, NEG, abs(display)</text>
  </g>
  <g>
    <rect class="box" x="1850" y="165" width="400" height="390" fill="#ede9fe"/>
    <text x="2050" y="208" class="heading" text-anchor="middle">alu</text>
    <text x="1885" y="248" class="wire-label">Request from calculator_core</text>
    <text x="1885" y="278" class="body">A[15:0], B[15:0], op[1:0], signed</text>
    <text x="1885" y="308" class="body">input_valid ↔ input_ready</text>
    <line x1="1885" y1="330" x2="2215" y2="330" class="divider"/>
    <text x="1885" y="365" class="wire-label">Response to calculator_core</text>
    <text x="1885" y="395" class="body">result[15:0], error</text>
    <text x="1885" y="425" class="body">result_valid ↔ result_ready</text>
    <line x1="1885" y1="447" x2="2215" y2="447" class="divider"/>
    <text x="1885" y="472" class="wire-label">Datapath</text>
    <text x="1885" y="502" class="body">ADD/SUB; 16-cycle MUL and DIV</text>
    <text x="1885" y="532" class="body">Signed DIV conversion; own full_adder</text>
  </g>
  <g>
    <rect class="box" x="1290" y="970" width="400" height="290" fill="#cffafe"/>
    <text x="1490" y="1008" class="heading" text-anchor="middle">output_driver</text>
    <text x="1314" y="1046" class="body" text-anchor="start">Hex → active-high a…g</text>
<text x="1314" y="1074" class="body" text-anchor="start">Leading-zero suppression</text>
<text x="1314" y="1102" class="body" text-anchor="start">Minus sign and Err patterns</text>
<text x="1314" y="1130" class="body" text-anchor="start">35 clocks; 29 retained outputs</text>
<text x="1314" y="1158" class="body" text-anchor="start">Capture SER on falling SRCLK</text>
  </g>

  <g>
    <rect class="box" x="2320" y="480" width="420" height="260" fill="#fce7f3"/>
    <text x="2530" y="518" class="heading" text-anchor="middle">Operation Indicators</text>
    <text x="2344" y="556" class="body" text-anchor="start">Four independent active-high outputs</text>
<text x="2344" y="584" class="body" text-anchor="start">Low-current LED + resistor</text>
<text x="2344" y="612" class="body" text-anchor="start">or an external NMOS driver</text>
<text x="2344" y="640" class="body" text-anchor="start"></text>
<text x="2344" y="668" class="body" text-anchor="start">At most one selected-op line is high</text>
  </g>
  <g>
    <rect class="box" x="2320" y="890" width="420" height="410" fill="#fee2e2"/>
    <text x="2530" y="928" class="heading" text-anchor="middle">External SIPO / LED Driver</text>
    <text x="2344" y="966" class="body" text-anchor="start">SIPO = serial-in / parallel-out</text>
<text x="2344" y="994" class="body" text-anchor="start">35 clocks; retain 29 useful outputs</text>
<text x="2344" y="1022" class="body" text-anchor="start">First 6 bits are always-zero dummies</text>
<text x="2344" y="1050" class="body" text-anchor="start">Capture SER on falling SRCLK</text>
<text x="2344" y="1078" class="body" text-anchor="start"></text>
<text x="2344" y="1106" class="body" text-anchor="start">For clean updates, provide either:</text>
<text x="2344" y="1134" class="body" text-anchor="start">• latch on rising RCLK</text>
<text x="2344" y="1162" class="body" text-anchor="start">• output blanking via OE_n</text>
<text x="2344" y="1190" class="body" text-anchor="start"></text>
<text x="2344" y="1218" class="body" text-anchor="start">Push-pull common-cathode drive</text>
<text x="2344" y="1246" class="body" text-anchor="start">or external transistor LED drivers</text>
  </g>

  <path class="wire-left" d="M790 315 H440"/>
<text x="600" y="307" class="wire-label" text-anchor="middle">WL0 / uo[0]</text>
<path class="wire-left" d="M790 353 H440"/>
<text x="600" y="345" class="wire-label" text-anchor="middle">WL1 / uo[1]</text>
<path class="wire-left" d="M790 391 H440"/>
<text x="600" y="383" class="wire-label" text-anchor="middle">WL2 / uo[2]</text>
<path class="wire-left" d="M790 429 H440"/>
<text x="600" y="421" class="wire-label" text-anchor="middle">WL3 / uo[3]</text>
<path class="wire" d="M440 495 H790"/>
<text x="600" y="487" class="wire-label" text-anchor="middle">BL0 / ui[0]</text>
<path class="wire" d="M440 533 H790"/>
<text x="600" y="525" class="wire-label" text-anchor="middle">BL1 / ui[1]</text>
<path class="wire" d="M440 571 H790"/>
<text x="600" y="563" class="wire-label" text-anchor="middle">BL2 / ui[2]</text>
<path class="wire" d="M440 609 H790"/>
<text x="600" y="601" class="wire-label" text-anchor="middle">BL3 / ui[3]</text>
<path class="wire" d="M440 730 H790"/>
<text x="615" y="721" class="wire-label" text-anchor="middle">ADD / ui[4]</text>
<path class="wire" d="M440 770 H790"/>
<text x="615" y="761" class="wire-label" text-anchor="middle">SUB / ui[5]</text>
<path class="wire" d="M440 810 H790"/>
<text x="615" y="801" class="wire-label" text-anchor="middle">MUL / ui[6]</text>
<path class="wire" d="M440 850 H790"/>
<text x="615" y="841" class="wire-label" text-anchor="middle">DIV / ui[7]</text>
<path class="wire" d="M440 890 H790"/>
<text x="615" y="881" class="wire-label" text-anchor="middle">EQ / uio[4]</text>
<path class="wire" d="M440 930 H790"/>
<text x="615" y="921" class="wire-label" text-anchor="middle">AC / uio[5]</text>
<path class="wire" d="M440 970 H790"/>
<text x="615" y="961" class="wire-label" text-anchor="middle">NEG / uio[6]</text>
<path class="wire" d="M440 1040 H1205 V790 H1290"/>
<text x="650" y="1025" class="wire-label" text-anchor="middle">NEG_EN / uio[7] → calculator_core</text>
<path class="wire" d="M1690 580 H2320"/>
<text x="2010" y="572" class="wire-label" text-anchor="middle">ADD / uio[0]</text>
<path class="wire" d="M1690 618 H2320"/>
<text x="2010" y="610" class="wire-label" text-anchor="middle">SUB / uio[1]</text>
<path class="wire" d="M1690 656 H2320"/>
<text x="2010" y="648" class="wire-label" text-anchor="middle">MUL / uio[2]</text>
<path class="wire" d="M1690 694 H2320"/>
<text x="2010" y="686" class="wire-label" text-anchor="middle">DIV / uio[3]</text>
<path class="wire" d="M1690 1050 H2320"/>
<text x="2010" y="1041" class="wire-label" text-anchor="middle">SER / uo[4]</text>
<path class="wire" d="M1690 1092 H2320"/>
<text x="2010" y="1083" class="wire-label" text-anchor="middle">SRCLK / uo[5]</text>
<path class="wire" d="M1690 1134 H2320"/>
<text x="2010" y="1125" class="wire-label" text-anchor="middle">RCLK / uo[6] (rising-edge latch)</text>
<path class="wire" d="M1690 1176 H2320"/>
<text x="2010" y="1167" class="wire-label" text-anchor="middle">OE_n / uo[7]</text>

  <path class="bus" d="M1130 430 H1290"/>
  <text x="1210" y="400" class="bus-label" text-anchor="middle">button transaction</text>
  <text x="1210" y="458" class="small" text-anchor="middle">data[4:0], valid ↔ ready</text>

  <path class="bus" d="M1690 430 H1850"/>
  <text x="1770" y="405" class="bus-label" text-anchor="middle">ALU transaction bus</text>

  <path class="bus" d="M1490 865 V970"/>
  <text x="1520" y="910" class="bus-label">display transaction</text>
  <text x="1520" y="937" class="small">data[15:0], error, is_neg, valid ↔ ready</text>

  <rect x="2320" y="1340" width="420" height="145" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="2350" y1="1380" x2="2440" y2="1380" class="wire"/><text x="2470" y="1387" class="small">one physical wire</text>
  <line x1="2350" y1="1435" x2="2440" y2="1435" class="bus"/><text x="2470" y="1442" class="small">grouped valid/ready transaction</text>
  </svg>